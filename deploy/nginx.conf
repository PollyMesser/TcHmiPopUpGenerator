# nginx im App-Container. Das Gateway hat das Präfix /popupgenerator
# bereits entfernt; hier kommen Pfade wie /, /assets/... an.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-Page-App: unbekannte Pfade -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dateien mit Hash im Namen dürfen lange gecacht werden
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html nie cachen, damit neue Versionen sofort ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

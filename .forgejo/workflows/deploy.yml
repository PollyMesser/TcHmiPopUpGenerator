# .forgejo/workflows/deploy.yml
name: Deploy to forgejo_nginx
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: docker
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build
        run: npm run build
 
      - name: Install docker CLI
        run: apt-get update && apt-get install -y docker.io
 
      - name: Deploy dist to forgejo_nginx volume
        run: |
          CONTAINER_ID=$(hostname)
          docker run --rm -d --name deploy_helper -v forgejo_nginx_dist:/target alpine sleep 60
          docker exec deploy_helper sh -c "rm -rf /target/* /target/.[!.]* 2>/dev/null || true"
          docker cp "$CONTAINER_ID:$GITHUB_WORKSPACE/dist/." deploy_helper:/target/
          docker stop deploy_helper